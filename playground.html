  <div class="custom-cursor" id="customCursor"><span class="cursor-label">READ CASE STUDY →</span></div>

  <script>
    const customCursor = document.getElementById('customCursor');

    document.addEventListener('mousemove', e => {
      customCursor.style.left = e.clientX + 'px';
      customCursor.style.top  = e.clientY + 'px';
    });

    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mouseenter', () => customCursor.classList.add('is-card'));
      card.addEventListener('mouseleave', () => customCursor.classList.remove('is-card'));
    });
  </script>
